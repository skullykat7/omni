<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Hangout</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 14px system-ui, sans-serif; color: #eee; }
  canvas { display: block; touch-action: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(0,0,0,.85); }
  .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-sizing: border-box; }
  .sw.on { border-color: #fff; box-shadow: inset 0 0 0 2px #000; }
  #nm { width: 110px; box-sizing: border-box; padding: 4px 8px; border: 1px solid #444; border-radius: 6px; background: #1a1a1a; color: #fff; font: inherit; outline: none; }
  #nm:focus { border-color: #fff; }
  #status { margin-left: auto; font-size: 12px; opacity: .7; }
  #chat { position: fixed; left: 10px; bottom: 10px; width: min(360px, calc(100% - 20px)); pointer-events: none; }
  #msg, #chat.open #log { pointer-events: auto; }
  #log { height: 200px; overflow-y: auto; padding: 6px 8px; background: rgba(0,0,0,.8); border-radius: 8px 8px 0 0; font-size: 13px; }
  #log div { margin: 2px 0; word-wrap: break-word; }
  #log b { margin-right: 5px; }
  #msg { width: 100%; box-sizing: border-box; padding: 9px; border: 0; border-radius: 0 0 8px 8px; background: #222; color: #fff; font: inherit; outline: none; }
</style>
</head>

<script>

};
const others = new Map(), keys = new Set();
const bullets = [], parts = [], puffs = [], floats = [], ghosts = [], rings = [], mouse = { x: RW / 2 + 100, y: RH / 2 };
let W, H, sc = 1, ox = 0, oy = 0, lastSend = 0, moved = false, online = false;
let camX0 = 0, camY0 = 0, camS = 1, curX = innerWidth / 2 + 100, curY = innerHeight / 2;
const cam = { x: 0, y: 0, room: "" };

let freezeUntil = 0, flash = 0, flashCol = "255,255,255", debt = 0, catchUntil = 0, lastDash = 0, lastParry = 0, parryCombo = 0, lastParryHit = 0, parryBuf = 0, big = null, rs = { phase: "play", n: 0, left: 0 }, lastPhase = "", lastRound = -1, results = null, resultsAt = 0, lastCount = -1, shake = 0, hitMarkUntil = 0, toastMsg = "", toastUntil = 0, muted = false, lock = null, ac = null;
let assist = true;
try { assist = localStorage.getItem("hg_assist") !== "0"; } catch (e) {}

function setStatus(s) { $("status").textContent = s; }

const num = (v, lo, hi) => Math.min(hi, Math.max(lo, +v || 0));
function send(event, payload) { if (online) room.send({ type: "broadcast", event, payload }); }

}

// ---- particles ----
function explode(x, y, c, room) {
  for (let i = 0; i < 44; i++) {
    const a = Math.random() * 6.283, s = 60 + Math.random() * 300, life = 0.6 + Math.random() * 0.9;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, r: 2 + Math.random() * 4, c, rm: room || "main" });
  }

}
function sparks(x, y, c, n, room) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 40 + Math.random() * 120, life = 0.25 + Math.random() * 0.25;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, r: 1.5 + Math.random() * 1.5, c, rm: room || "main" });
  }
}

// ---- run personality: smoke puffs + squash & stretch ----
function puff(x, y, dx, dy, room) {
  const life = 0.35 + Math.random() * 0.25;
  puffs.push({
    x: x - dx * R * 0.9 + (Math.random() - 0.5) * 6, y: y - dy * R * 0.9 + (Math.random() - 0.5) * 6 + 4,
    vx: -dx * 25 + (Math.random() - 0.5) * 30, vy: -dy * 25 + (Math.random() - 0.5) * 30 - 8,
    life, max: life, r: 3 + Math.random() * 3, rm: room || "main"
  });
  if (puffs.length > 300) puffs.shift();
}
// works for you and for everyone else: measures how fast the circle is moving,
// then springs the stretch toward it so it overshoots (jelly wobble) when you stop
function animate(o, dt) {
  if (dt < 0.001) return;
  if (o.px === undefined || o.dead) { o.px = o.x; o.py = o.y; o.s = 0; o.sv = 0; o.run = 0; return; }
  let vx = (o.x - o.px) / dt, vy = (o.y - o.py) / dt, sp = Math.hypot(vx, vy);
  o.px = o.x; o.py = o.y;
  if (sp > 2600) { vx = vy = sp = 0; }            // teleport (respawn), not running
  if (sp > 20) o.ang = Math.atan2(vy, vx);
  const target = Math.min(0.55, sp / SPEED * 0.32);
  o.sv = (o.sv || 0) + (220 * (target - (o.s || 0)) - 18 * (o.sv || 0)) * dt;
  o.s = Math.max(-0.35, Math.min(0.5, (o.s || 0) + o.sv * dt));
  o.ph = (o.ph || 0) + sp * dt * 0.06;                  // step cycle advances with distance run
  o.run = sp;
  o.pt = (o.pt || 0) + dt;
  if (sp > 80 && o.pt > 0.05) { o.pt = 0; puff(o.x, o.y, vx / sp, vy / sp, o.room); }
  if (o.dashUntil && Date.now() < o.dashUntil) {         // dash trail: after-images + dense smoke
    ghosts.push({ x: o.x, y: o.y, c: o.color, life: 0.22, max: 0.22, rm: o.room || "main" });
    puff(o.x, o.y, o.dashDx || 0, o.dashDy || 0, o.room); puff(o.x, o.y, o.dashDx || 0, o.dashDy || 0, o.room);
    if (ghosts.length > 200) ghosts.shift();
  }
}

// ---- aim helpers: toast, sound, aim assist ----
function toast(t, ms) { toastMsg = t; toastUntil = Date.now() + (ms || 1500); }
function sfx(type, vol, pm) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const S = {                                  // [wave, start pitch, end pitch, seconds, loudness]
      shoot: ["square", 520, 120, 0.09, 0.05], hit: ["triangle", 880, 1300, 0.07, 0.09],
      hurt: ["sawtooth", 220, 80, 0.15, 0.12], kill: ["triangle", 600, 1500, 0.22, 0.12],
      boom: ["sawtooth", 160, 40, 0.3, 0.16], pick: ["square", 400, 900, 0.1, 0.07], dash: ["triangle", 700, 200, 0.14, 0.07],
      parry: ["square", 1400, 2600, 0.14, 0.12], thud: ["sine", 140, 35, 0.28, 0.3],
      whiff: ["triangle", 500, 900, 0.08, 0.04], super: ["sawtooth", 300, 1800, 0.25, 0.1]
    }[type];
    const t = ac.currentTime, o = ac.createOscillator(), v = ac.createGain();
    o.type = S[0]; o.frequency.setValueAtTime(S[1] * (pm || 1), t); o.frequency.exponentialRampToValueAtTime(S[2] * (pm || 1), t + S[3]);
    v.gain.setValueAtTime(S[4] * (vol || 1), t); v.gain.exponentialRampToValueAtTime(0.0001, t + S[3]);
    o.connect(v); v.connect(ac.destination); o.start(t); o.stop(t + S[3] + 0.02);
  } catch (e) {}
}
function angDiff(a, b) { const d = a - b; return Math.atan2(Math.sin(d), Math.cos(d)); }
// soft aim assist: if an enemy is close to where you're pointing, aim at them (and a bit ahead of
// where they're running, so moving targets get hit). Close enemies get a wider "magnet".
function assistAim() {
  let best = null, bestS = 1;
  others.forEach(o => {
    if (o.dead || o.room !== me.room) return;
    const dx = o.x - me.x, dy = o.y - me.y, d = Math.hypot(dx, dy);
    if (d < 20 || d > BULLET_SPEED * BULLET_LIFE * 0.9) return;
    const lim = 0.3 + 0.3 * Math.max(0, 1 - d / 300);
    const sc2 = Math.abs(angDiff(Math.atan2(dy, dx), me.aim)) / lim;
    if (sc2 < bestS) { bestS = sc2; best = o; }
  });
  if (!best) return null;
  const d = Math.hypot(best.x - me.x, best.y - me.y), sp = best.run || 0, t = d / BULLET_SPEED * 0.8;
  const px = best.x + Math.cos(best.ang || 0) * sp * t, py = best.y + Math.sin(best.ang || 0) * sp * t;
  const ta = Math.atan2(py - me.y, px - me.x);
  return { a: me.aim + angDiff(ta, me.aim) * 0.85, o: best, px, py };
}

// ---- dash + hit-stop ----
// hit-stop: the whole world pauses for a split second on a kill, with a white flash.
// Messages from other players keep arriving while it's paused, so afterwards everyone
// is smoothly pulled into their real positions (see "catchUntil" in the main loop).
function hitstop(ms, amt, col) { freezeUntil = Math.max(freezeUntil, Date.now() + ms); flash = Math.max(flash, amt); flashCol = col || "255,255,255"; }
function dash() {
  const now = Date.now();
  if (me.dead || now < freezeUntil || now - lastDash < DASH_CD || me.dashT > 0) return;
  let dx = 0, dy = 0;
  if (keys.has("arrowleft") || keys.has("a")) dx -= 1;
  if (keys.has("arrowright") || keys.has("d")) dx += 1;
  if (keys.has("arrowup") || keys.has("w")) dy -= 1;
  if (keys.has("arrowdown") || keys.has("s")) dy += 1;
  if (!dx && !dy && me.tx !== null) { dx = me.tx - me.x; dy = me.ty - me.y; }   // walking to a click: dash that way
  if (!dx && !dy) { dx = Math.cos(me.aim); dy = Math.sin(me.aim); }              // standing still: dash toward the cursor
  const l = Math.hypot(dx, dy) || 1;
  me.dashDx = dx / l; me.dashDy = dy / l; me.dashT = DASH_TIME; me.dashUntil = now + DASH_TIME * 1000; lastDash = now;
  shake = Math.max(shake, 2); sfx("dash");
  send("dash", { id, dx: me.dashDx, dy: me.dashDy });
  sendPos();
}

// ---- rounds ----
// Free for all, 1 point per kill. Rounds run on the shared clock (every computer's Date.now()):
// ROUND_MS of play, then BREAK_MS in the safe zone with the arena door locked, over and over.
function roundState(now) {
  const t = now % CYCLE_MS, n = Math.floor(now / CYCLE_MS);
  return t < ROUND_MS ? { phase: "play", n, left: ROUND_MS - t } : { phase: "break", n, left: CYCLE_MS - t };
}
function standings() {
  const list = [{ id, name, color: me.color, pts: me.pts || 0, me: true }];
  others.forEach((o, k) => { if (o.rn === rs.n && o.name) list.push({ id: k, name: o.name, color: o.color, pts: o.pts || 0 }); });
  return list.sort((a, b) => b.pts - a.pts);
}
function phaseChange(now) {
  const first = lastPhase === "";
  lastPhase = rs.phase; lastRound = rs.n; lastCount = -1;
  bullets.length = 0;
  if (rs.phase === "play") {                       // new round: scores reset, guns restocked, the door opens
    me.pts = 0; results = null; resultsAt = 0;
    GUNS.forEach(s => { s.up = true; });
    if (!first) { sfx("pick"); flash = Math.max(flash, 0.35); flashCol = "255,255,255"; }
    addLog("*", "Round started. Free for all: 1 point per kill.", "#aaa"); sendPos();
  } else if (!first) {                             // round over: everyone is pulled back into the safe zone
    if (me.room === "main" || me.dead) { respawn(); me.parryT = 0; }
    flash = Math.max(flash, 0.5); flashCol = "255,255,255"; sfx("kill");
    resultsAt = now + 800;                         // wait a beat so the last kills' messages arrive before ranking
  }
}
function announce() {
  results = standings();
  const top = results[0];
  if (!top || top.pts < 1) { toast("Round over. Nobody scored.", 3500); addLog("*", "Round over. Nobody scored.", "#aaa"); return; }
  const w = results.filter(e => e.pts === top.pts).map(e => e.me ? "You" : e.name);
  const msg = (w.length > 1 ? w.join(" & ") + " tie" : w[0] + (w[0] === "You" ? " win" : " wins")) + " with " + top.pts + (top.pts === 1 ? " kill" : " kills");
  toast(msg, 4000); addLog("*", "Round over. " + msg + ".", "#ffd43b");
}

// ---- rooms + camera ----
// chill room (big, camera follows you) = where you spawn. Walk through its door to enter the arena
// (the fixed-camera room with the guns). There is no door back: you return to the chill room by dying.
function dims(room) { return room === "chill" ? [CW, CH] : [RW, RH]; }
function updateCam(dt) {
  if (me.room === "chill") {
    const z = Math.max(0.6, Math.min(W / 1000, H / 650)), hw = W / (2 * z), hh = H / (2 * z);
    if (cam.room !== "chill") { cam.x = me.x; cam.y = me.y; cam.room = "chill"; }     // snap when you arrive
    const f = 1 - Math.exp(-8 * dt);
    cam.x += (me.x - cam.x) * f; cam.y += (me.y - cam.y) * f;
    const tx = CW > 2 * hw ? Math.max(hw, Math.min(CW - hw, cam.x)) : CW / 2;           // don't show past the walls
    const ty = CH > 2 * hh ? Math.max(hh, Math.min(CH - hh, cam.y)) : CH / 2;
    camS = z; camX0 = W / 2 - tx * z; camY0 = H / 2 - ty * z;
  } else { cam.room = "main"; camS = sc; camX0 = ox; camY0 = oy; }
}
function enterArena() {
  me.room = "main"; me.x = 70; me.y = RH / 2; me.tx = me.ty = null; me.dashT = 0;
  me.shield = Date.now() + SHIELD_MS; flash = Math.max(flash, 0.7); sfx("pick");
  toast("The door locked behind you. No way back until you die.", 3000);
  sendPos();
}

// ---- parry ----
// F opens a short parry window. Any bullet that touches the ring during it is knocked back at the
// shooter: faster and harder each time it's parried (so two players can rally it back and forth).
// Rewards: heal, instant dash, no cooldown, brief invincibility, hit-stop, gold flash, shake, shockwave, combo counter.
function bang(t, sub) { const now = Date.now(); big = { t, sub: sub || "", at: now, until: now + 650 }; }
function ring(x, y, r1, c, life) { rings.push({ x, y, r0: 12, r1, life, max: life, c, rm: "main" }); }
function parry() {
  const now = Date.now();
  if (me.dead || me.room !== "main") return;
  if (now < freezeUntil) { parryBuf = now; return; }              // pressed during a freeze: go the moment it ends
  if (now - lastParry < PARRY_CD) return;                          // whiffing costs you a moment
  lastParry = now; me.parryT = PARRY_WINDOW; sfx("whiff");
  send("pw", { id });
}
function doParry(b) {
  const now = Date.now(), l = assist ? assistAim() : null, a = l ? l.a : me.aim;
  b.owner = id; b.par = (b.par || 0) + 1;
  const sp = BULLET_SPEED * (1.5 + 0.25 * (b.par - 1));
  b.x = me.x + Math.cos(a) * (R + 18); b.y = me.y + Math.sin(a) * (R + 18);
  b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.life = BULLET_LIFE; b.c = "#ffd43b"; b.dmg = Math.min(100, DMG + 25 * b.par);
  parryCombo = now - lastParryHit < 2500 ? parryCombo + 1 : 1; lastParryHit = now;
  me.hp = Math.min(MAXHP, me.hp + 20); lastDash = 0; lastParry = 0;
  me.shield = Math.max(me.shield, now + 350);
  floats.push({ x: me.x, y: me.y - R - 6, t: "+20", c: "#69db7c", s: 20, life: 0.9, max: 0.9 });
  sparks(me.x, me.y, "#ffd43b", 18); sparks(me.x, me.y, "#fff", 8);
  ring(me.x, me.y, 100 + Math.min(parryCombo, 5) * 12, "#ffd43b", 0.3);
  shake = Math.max(shake, (8 + Math.min(parryCombo, 4)) * JUICE);
  hitstop(Math.round((90 + Math.min(parryCombo, 4) * 12) * JUICE), 0.8 * JUICE, "255,215,90");
  bang("PARRY", parryCombo > 1 ? "x" + parryCombo : "");
  const pm = 1 + 0.1 * Math.min(parryCombo - 1, 9);                // every combo hit rings higher
  sfx("parry", 0.8, pm); sfx("thud", 0.5);
  send("parry", { id, b: b.id, x: b.x, y: b.y, a, par: b.par, cx: me.x, cy: me.y });
  sendPos();
}

// ---- bullets ----
function addBullet(owner, bid, x, y, a, c) {
  bullets.push({ id: bid, owner, x, y, vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED, life: BULLET_LIFE, c });
  if (bullets.length > 300) bullets.shift();
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function fire() {
  const now = Date.now();
  if (!me.armed || me.dead) return;
  if (now < freezeUntil) { queuedShot = true; return; }
  if (now - lastShot < COOLDOWN) { if (now - lastShot > COOLDOWN - 120) queuedShot = true; return; }
  queuedShot = false;
  lastShot = now;
  const l = assist ? assistAim() : null, a = l ? l.a : me.aim;
  const sx = me.x + Math.cos(a) * (R + 14), sy = me.y + Math.sin(a) * (R + 14);
  const bid = id + ":" + (shots++);
  addBullet(id, bid, sx, sy, a, me.color);
  send("shot", { id, b: bid, x: sx, y: sy, a, c: me.color });
  me.kick = 1; shake = Math.max(shake, 1.5); sfx("shoot");
}
// you are the one who decides if you got hit (no server), then tell everyone
function hurt(b) {
  const d = b.dmg || DMG;
  me.hp -= d;
  sparks(b.x, b.y, me.color, 6);
  shake = Math.max(shake, d > DMG ? 9 : 7); sfx("hurt");
  floats.push({ x: me.x, y: me.y - R - 6, t: "-" + d, c: "#ff6b6b", life: 0.8, max: 0.8 });
  send("hit", { id, b: b.id, x: b.x, y: b.y, hp: Math.max(0, me.hp), dmg: d });
  if (me.hp <= 0) die(b.owner, b.par); else sendPos();
}
function die(by, par) {
  me.hp = 0; me.dead = true; me.armed = false; me.tx = me.ty = null; me.respawnAt = Date.now() + RESPAWN_MS;
  const o = others.get(by), killer = o && o.name ? o.name : "someone";
  explode(me.x, me.y, me.color);
  shake = 14; sfx("boom"); me.dashT = 0; me.parryT = 0; parryCombo = 0; hitstop(FREEZE_MS, 0.9);
  addLog("\u2620", name + " was killed by " + killer, "#aaa");
  send("die", { id, name, color: me.color, x: me.x, y: me.y, by: killer, byId: by, par: par || 0 });
  sendPos();
}
function respawn() {
  me.dead = false; me.hp = MAXHP; me.armed = false; me.dashT = 0;
  me.room = "chill"; me.x = 650 + Math.random() * 300; me.y = CH / 2 + (Math.random() - 0.5) * 400; me.tx = me.ty = null;
  me.shield = Date.now() + SHIELD_MS;
  sendPos();
}

addEventListener("pointermove", e => { curX = e.clientX; curY = e.clientY; mouse.x = (curX - camX0) / camS; mouse.y = (curY - camY0) / camS; });

addEventListener("pointerdown", e => {

  g.textAlign = "center";
  if (me.dead) {
    g.fillStyle = "#fff"; g.font = "28px system-ui"; g.fillText("You exploded!", W / 2, H / 2 - 6);
    g.font = "16px system-ui"; g.fillText("Respawning in " + Math.max(1, Math.ceil((me.respawnAt - now) / 1000)), W / 2, H / 2 + 22);
  } else if (me.armed && now < hintUntil) {
    g.fillStyle = "rgba(255,255,255,.8)"; g.font = "14px system-ui";
    g.fillText("Aim with the mouse. E shoot (hold), F parry, Space/Shift dash. WASD or click to move. Q aim assist, M sound.", W / 2, 70);
  } else if (me.room === "chill") {
    g.fillStyle = "rgba(255,255,255,.55)"; g.font = "14px system-ui";
    g.fillText(rs.phase === "play" ? "Safe Zone" : "Intermission: the arena opens when the timer hits 0. 1 point per kill.", W / 2, 70);
  }
  if (now < toastUntil) {
    g.globalAlpha = Math.min(1, (toastUntil - now) / 400); g.fillStyle = "#fff"; g.font = "bold 22px system-ui";
    g.fillText(toastMsg, W / 2, 110); g.globalAlpha = 1;
  }
  drawRoundHud(now);
  if (!me.dead) {                                   // dash cooldown bar
    const r = Math.min(1, (now - lastDash) / DASH_CD);
    g.fillStyle = "rgba(255,255,255,.15)"; g.fillRect(W / 2 - 40, H - 22, 80, 5);
    g.fillStyle = r >= 1 ? "#fff" : "rgba(255,255,255,.5)"; g.fillRect(W / 2 - 40, H - 22, 80 * r, 5);
    const pr = Math.min(1, (now - lastParry) / PARRY_CD);            // parry cooldown bar (gold)
    g.fillStyle = "rgba(255,215,90,.15)"; g.fillRect(W / 2 - 40, H - 14, 80, 5);
    g.fillStyle = pr >= 1 ? "#ffd43b" : "rgba(255,215,90,.5)"; g.fillRect(W / 2 - 40, H - 14, 80 * pr, 5);
  }
  if (flash > 0.01) { g.fillStyle = "rgba(" + flashCol + "," + Math.min(1, flash) + ")"; g.fillRect(0, 0, W, H); }   // hit-stop flash
  if (big && now < big.until) {                     // PARRY! pops in huge, then settles and fades
    const age = now - big.at, pop = age < 120 ? 1.25 - 0.25 * (age / 120) : 1;
    g.save(); g.translate(W / 2, H * 0.22); g.scale(pop, pop); g.globalAlpha = Math.min(1, (big.until - now) / 250);
    g.textAlign = "center"; g.lineJoin = "round"; g.lineWidth = 5; g.strokeStyle = "#000";
    g.font = "bold 30px system-ui"; g.strokeText(big.t, 0, 0); g.fillStyle = "#ffd43b"; g.fillText(big.t, 0, 0);
    if (big.sub) { g.font = "bold 18px system-ui"; g.strokeText(big.sub, 0, 26); g.fillStyle = "#fff"; g.fillText(big.sub, 0, 26); }
    g.restore();
  }
}

// ---- main loop ----
let prev = performance.now();
function tick(t) {
  const dt = Math.min(0.05, (t - prev) / 1000); prev = t;
  const now = Date.now();
  rs = roundState(now);
  if (rs.n !== lastRound || rs.phase !== lastPhase) phaseChange(now);
  if (resultsAt && now >= resultsAt) { resultsAt = 0; announce(); }
  const csec = Math.ceil(rs.left / 1000);
  if (rs.phase === "break" && csec <= 3 && csec !== lastCount) { lastCount = csec; sfx("whiff", 0.8, 1.6); }   // 3, 2, 1 ticks
  const frozen = now < freezeUntil;                 // hit-stop: the world pauses for a moment...
  if (frozen) { debt = Math.min(0.3, debt + dt); catchUntil = freezeUntil + 250; }
  const mdt = frozen ? 0 : dt;                      // (your own movement just pauses)
  let sdt = mdt;                                    // ...then bullets and smoke fast-forward to catch up
  if (!frozen && debt > 0) { const x = Math.min(debt, dt * 2); sdt += x; debt -= x; }
  if (!frozen) flash = flash < 0.02 ? 0 : flash * Math.exp(-9 * dt);
  if (me.dead && now >= me.respawnAt) respawn();
  updateCam(dt);
  mouse.x = (curX - camX0) / camS; mouse.y = (curY - camY0) / camS;     // the camera moves, so re-aim every frame
  me.aim = Math.atan2(mouse.y - me.y, mouse.x - me.x);
  lock = assist && me.armed && !me.dead ? assistAim() : null;

  let dx = 0, dy = 0;
  if (!me.dead) {
    if (keys.has("arrowleft") || keys.has("a")) dx -= 1;
    if (keys.has("arrowright") || keys.has("d")) dx += 1;
    if (keys.has("arrowup") || keys.has("w")) dy -= 1;
    if (keys.has("arrowdown") || keys.has("s")) dy += 1;
    if (!dx && !dy && me.tx !== null) {
      const ex = me.tx - me.x, ey = me.ty - me.y, d = Math.hypot(ex, ey);
      if (d < 4) me.tx = me.ty = null; else { dx = ex / d; dy = ey / d; }
    }
  }
  if (me.dashT > 0) {                               // dashing: a fixed burst that ignores everything else
    me.dashT -= mdt;
    const [mw, mh] = dims(me.room);
    me.x = num(me.x + me.dashDx * DASH_SPEED * mdt, R, mw - R); me.y = num(me.y + me.dashDy * DASH_SPEED * mdt, R, mh - R);
    if (now - lastSend > 40) sendPos();
    if (me.dashT <= 0) { me.dashT = 0; sendPos(); }
  } else if (dx || dy) {
    const l = Math.hypot(dx, dy) || 1;
    const [mw, mh] = dims(me.room);
    me.x = num(me.x + dx / l * SPEED * mdt, R, mw - R); me.y = num(me.y + dy / l * SPEED * mdt, R, mh - R);
    if (now - lastSend > 100) sendPos();
  } else if (me.armed && !me.dead && Math.abs(me.aim - lastAim) > 0.08 && now - lastSend > 120) {
    sendPos();
  }

  if (me.room === "chill" && rs.phase === "play" && !me.dead && !frozen && me.x > CW - 70 && me.y > DOOR.y0 && me.y < DOOR.y1) enterArena();
  animate(me, mdt);
  if (queuedShot) { if (!me.armed || me.dead) queuedShot = false; else if (now - lastShot >= COOLDOWN) fire(); }
  if (keys.has("e") && me.armed && !me.dead) fire();   // hold E to keep firing
  me.kick = Math.max(0, (me.kick || 0) - sdt * 7);
  shake = shake < 0.05 ? 0 : shake * Math.pow(0.0001, sdt);
  if (me.parryT > 0) me.parryT = Math.max(0, me.parryT - mdt);
  if (parryBuf && !frozen) { const t0 = parryBuf; parryBuf = 0; if (now - t0 < 250) parry(); }
  if (parryCombo && now - lastParryHit > 2500) parryCombo = 0;

  // gun pickups
  GUNS.forEach((s, i) => {
    if (!s.up && now - s.at > GUN_RESPAWN_MS) s.up = true;
    if (s.up && me.room === "main" && !me.dead && !me.armed && Math.hypot(me.x - s.x, me.y - s.y) < R + 14) {
      me.armed = true; s.up = false; s.at = now; hintUntil = now + 7000;
      sfx("pick");
      send("grab", { id, s: i });
      sendPos();
    }
  });

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i], px = b.x, py = b.y;
    b.x += b.vx * sdt; b.y += b.vy * sdt; b.life -= sdt;
    if (b.life <= 0 || b.x < 0 || b.x > RW || b.y < 0 || b.y > RH) { bullets.splice(i, 1); continue; }
    if (me.parryT > 0 && b.owner !== id && me.room === "main" && !me.dead && segDist(me.x, me.y, px, py, b.x, b.y) < R + PARRY_R) { doParry(b); continue; }
    if (b.owner !== id && me.room === "main" && !me.dead && !(me.dashT > 0) && now >= me.shield && segDist(me.x, me.y, px, py, b.x, b.y) < R + 7) {
      bullets.splice(i, 1);
      hurt(b);
    }
  }

  // smoke puffs
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.x += p.vx * sdt; p.y += p.vy * sdt; p.life -= sdt;
    if (p.life <= 0) puffs.splice(i, 1);
  }

  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.y -= 40 * sdt; f.life -= sdt;
    if (f.life <= 0) floats.splice(i, 1);
  }

  for (let i = ghosts.length - 1; i >= 0; i--) { ghosts[i].life -= sdt; if (ghosts[i].life <= 0) ghosts.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].life -= sdt; if (rings[i].life <= 0) rings.splice(i, 1); }

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * sdt; p.y += p.vy * sdt;
    const f = Math.max(0, 1 - 2.2 * sdt); p.vx *= f; p.vy *= f;
    p.life -= sdt;
    if (p.life <= 0) parts.splice(i, 1);
  }

  others.forEach((o, k) => {
    if (now - o.seen > 5000) { others.delete(k); return; }
    if (frozen) return;                              // paused with everyone else; their latest position waits in o.tx / o.ty
    // after a freeze (or during a dash) pull them to where they really are quickly, so nobody pops or teleports
    const rate = now < catchUntil || (o.dashUntil && now < o.dashUntil) ? 45 : 18, f = 1 - Math.exp(-rate * dt);
    o.x += (o.tx - o.x) * f; o.y += (o.ty - o.y) * f;
    animate(o, dt);
    o.kick = Math.max(0, (o.kick || 0) - dt * 7);
  });

  const cur = me.armed && !me.dead ? "none" : "default";
  if (cv.style.cursor !== cur) cv.style.cursor = cur;
  render(now); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
