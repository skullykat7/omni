<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Hangout</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16141f; font: 14px system-ui, sans-serif; color: #eee; }
  canvas { display: block; touch-action: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(22,20,31,.85); }
  .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-sizing: border-box; }
  .sw.on { border-color: #fff; }
  #status { margin-left: auto; font-size: 12px; opacity: .7; }
  #chat { position: fixed; left: 10px; bottom: 10px; width: min(340px, calc(100% - 20px)); }
  #log { max-height: 130px; overflow-y: auto; padding: 6px 8px; background: rgba(22,20,31,.8); border-radius: 8px 8px 0 0; font-size: 13px; }
  #log div { margin: 2px 0; word-wrap: break-word; }
  #log b { margin-right: 5px; }
  #msg { width: 100%; box-sizing: border-box; padding: 9px; border: 0; border-radius: 0 0 8px 8px; background: #2b2840; color: #fff; font: inherit; outline: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top"><span>Color</span><span id="sws" style="display:flex;gap:4px"></span><span id="status">connecting</span></div>
<div id="chat"><div id="log"></div><input id="msg" maxlength="200" placeholder="Press Enter to chat. Only people nearby will hear you." autocomplete="off"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ---- Use the same values as your other Supabase files ----
const SUPABASE_URL = "https://twnudsfinxmyjzofirmh.supabase.co";
const SUPABASE_KEY = "sb_publishable_yaiGtjLBgjAid0f6cwj2Vw_mCMsDlUQ";
// -----------------------------------------------------------

const RW = 1200, RH = 800, R = 16, HEAR = 240, SPEED = 230;
const COLORS = ["#ff6b6b", "#ffa94d", "#ffd43b", "#69db7c", "#38d9a9", "#4dabf7", "#9775fa", "#f783ac"];
const $ = id => document.getElementById(id);
const cv = $("cv"), g = cv.getContext("2d"), logEl = $("log"), msgEl = $("msg");

let name = "";
try { name = localStorage.getItem("hg_name") || ""; } catch (e) {}
while (!name.trim()) name = prompt("Pick a name") || "";
name = name.trim().slice(0, 20);
try { localStorage.setItem("hg_name", name); } catch (e) {}

const id = Math.random().toString(36).slice(2, 10);
const me = { x: RW / 2, y: RH / 2, color: COLORS[Math.floor(Math.random() * COLORS.length)], tx: null, ty: null, say: "", until: 0 };
const others = new Map(), keys = new Set();
let W, H, sc = 1, ox = 0, oy = 0, lastSend = 0, moved = false;

function setStatus(s) { $("status").textContent = s; }
if (SUPABASE_URL.startsWith("PASTE")) { setStatus("add your Supabase URL and key at the top of the file"); throw new Error("Supabase not configured"); }
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const room = sb.channel("hangout", { config: { broadcast: { self: false } } });

const num = (v, lo, hi) => Math.min(hi, Math.max(lo, +v || 0));
function sendPos() {
  room.send({ type: "broadcast", event: "pos", payload: { id, name, color: me.color, x: me.x, y: me.y } });
  lastSend = Date.now();
}
room.on("broadcast", { event: "pos" }, ({ payload: p }) => {
  if (!p || typeof p.id !== "string") return;
  let o = others.get(p.id);
  if (!o) { o = { x: num(p.x, 0, RW), y: num(p.y, 0, RH), say: "", until: 0 }; others.set(p.id, o); }
  o.name = String(p.name || "?").slice(0, 20);
  o.color = COLORS.includes(p.color) ? p.color : COLORS[0];
  o.tx = num(p.x, 0, RW); o.ty = num(p.y, 0, RH); o.seen = Date.now();
}).on("broadcast", { event: "chat" }, ({ payload: p }) => {
  if (!p || typeof p.text !== "string") return;
  if (Math.hypot(num(p.x, 0, RW) - me.x, num(p.y, 0, RH) - me.y) > HEAR) return;
  const text = p.text.slice(0, 200), nm = String(p.name || "?").slice(0, 20);
  const o = others.get(p.id);
  if (o) { o.say = text; o.until = Date.now() + 6000; }
  addLog(nm, text, o ? o.color : "#ccc");
}).subscribe(s => {
  setStatus(s === "SUBSCRIBED" ? "online" : s === "TIMED_OUT" || s === "CHANNEL_ERROR" ? "connection lost" : "connecting");
  if (s === "SUBSCRIBED") sendPos();
});
setInterval(sendPos, 1500);

function addLog(nm, text, color) {
  const d = document.createElement("div"), b = document.createElement("b"), t = document.createElement("span");
  b.textContent = nm; b.style.color = color; t.textContent = text;
  d.append(b, t); logEl.appendChild(d);
  while (logEl.children.length > 40) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

// ---- input ----
msgEl.onkeydown = e => {
  e.stopPropagation();
  if (e.key === "Escape") msgEl.blur();
  if (e.key === "Enter") {
    const text = msgEl.value.trim(); msgEl.value = "";
    if (!text) return;
    me.say = text; me.until = Date.now() + 6000;
    addLog(name, text, me.color);
    room.send({ type: "broadcast", event: "chat", payload: { id, name, x: me.x, y: me.y, text } });
  }
};
addEventListener("keydown", e => {
  if (document.activeElement === msgEl) return;
  if (e.key === "Enter") { msgEl.focus(); e.preventDefault(); return; }
  keys.add(e.key.toLowerCase()); me.tx = null;
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
cv.onpointerdown = e => {
  me.tx = num((e.clientX - ox) / sc, R, RW - R);
  me.ty = num((e.clientY - oy) / sc, R, RH - R);
};

COLORS.forEach(c => {
  const s = document.createElement("div");
  s.className = "sw" + (c === me.color ? " on" : ""); s.style.background = c;
  s.onclick = () => { me.color = c; document.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x === s)); sendPos(); };
  $("sws").appendChild(s);
});

// ---- drawing ----
function fit() { W = cv.width = innerWidth; H = cv.height = innerHeight; sc = Math.min(W / RW, H / RH); ox = (W - RW * sc) / 2; oy = (H - RH * sc) / 2; }
addEventListener("resize", fit); fit();

function box(x, y, w, h, c, r) { g.fillStyle = c; g.beginPath(); g.roundRect(x, y, w, h, r || 10); g.fill(); }
function who(o, mine) {
  g.fillStyle = o.color; g.beginPath(); g.arc(o.x, o.y, R, 0, 7); g.fill();
  g.lineWidth = mine ? 3 : 1.5; g.strokeStyle = mine ? "#fff" : "rgba(0,0,0,.4)"; g.stroke();
  g.fillStyle = "#fff"; g.font = "13px system-ui"; g.textAlign = "center";
  g.fillText(mine ? name : o.name, o.x, o.y + R + 15);
  if (o.say && Date.now() < o.until) {
    const w = Math.min(220, g.measureText(o.say).width + 16);
    box(o.x - w / 2, o.y - R - 34, w, 24, "rgba(255,255,255,.95)", 12);
    g.fillStyle = "#222"; g.fillText(o.say.length > 30 ? o.say.slice(0, 29) + "..." : o.say, o.x, o.y - R - 17);
  }
}
function render() {
  g.fillStyle = "#16141f"; g.fillRect(0, 0, W, H);
  g.save(); g.translate(ox, oy); g.scale(sc, sc);
  box(0, 0, RW, RH, "#2a2640", 24);
  box(120, 120, 360, 200, "#3b3560", 30);          // rug
  box(160, 560, 320, 90, "#6b4f6e", 20);           // couch
  box(760, 140, 260, 140, "#7a5c3e", 18);          // table
  box(840, 520, 220, 160, "#3d5a4c", 40);          // plant corner
  g.strokeStyle = "rgba(255,255,255,.18)"; g.setLineDash([6, 8]); g.lineWidth = 2;
  g.beginPath(); g.arc(me.x, me.y, HEAR, 0, 7); g.stroke(); g.setLineDash([]);
  others.forEach(o => who(o, false));
  who(me, true);
  g.restore();
}

// ---- main loop ----
let prev = performance.now();
function tick(t) {
  const dt = Math.min(0.05, (t - prev) / 1000); prev = t;
  let dx = 0, dy = 0;
  if (keys.has("arrowleft") || keys.has("a")) dx -= 1;
  if (keys.has("arrowright") || keys.has("d")) dx += 1;
  if (keys.has("arrowup") || keys.has("w")) dy -= 1;
  if (keys.has("arrowdown") || keys.has("s")) dy += 1;
  if (!dx && !dy && me.tx !== null) {
    const ex = me.tx - me.x, ey = me.ty - me.y, d = Math.hypot(ex, ey);
    if (d < 4) me.tx = me.ty = null; else { dx = ex / d; dy = ey / d; }
  }
  if (dx || dy) {
    const l = Math.hypot(dx, dy) || 1;
    me.x = num(me.x + dx / l * SPEED * dt, R, RW - R); me.y = num(me.y + dy / l * SPEED * dt, R, RH - R);
    if (Date.now() - lastSend > 100) sendPos();
  }
  const now = Date.now();
  others.forEach((o, k) => {
    if (now - o.seen > 5000) { others.delete(k); return; }
    o.x += (o.tx - o.x) * 0.25; o.y += (o.ty - o.y) * 0.25;
  });
  render(); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
